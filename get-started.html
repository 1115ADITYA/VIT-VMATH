<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started — VMath</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,700&family=Figtree:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    (function() {
      const currentTheme = localStorage.getItem('theme');
      if (currentTheme === 'dark' || (!currentTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <style>
    #get-started-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background-color: var(--bg);
      color: var(--text);
    }
    
    #get-started-container h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 5vw, 4rem);
      margin-bottom: 1rem;
    }
    
    #get-started-container p {
      font-family: 'Figtree', sans-serif;
      font-size: 1.125rem;
      color: var(--muted);
      margin-bottom: 2rem;
      max-width: 600px;
    }

    #back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-family: 'Figtree', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      text-decoration: none;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    #back-btn:hover {
      background: var(--surface-hover);
      transform: translateY(-2px);
    }
    
    #back-btn svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  
  <div id="get-started-container">
    <h1>Welcome to VMath</h1>
    <p>This is your personalized workspace. Here you can find all the mathematical tools and resources to solve complex engineering problems effortlessly.</p>
    
    <a href="/" id="back-btn">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      Go Back to Home
    </a>
  </div>

</body>
</html>
